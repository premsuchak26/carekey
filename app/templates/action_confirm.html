{% extends "base.html" %}

{% block title %}{{ action_title }} - CareKey{% endblock %}

{% block content %}
<section class="action-confirmation-section" aria-labelledby="confirm-heading" style="max-width: 650px; margin: 2rem auto; padding: 2rem; background: #ffffff; border: 3px solid #1e3a8a; border-radius: 12px;">
    <h1 id="confirm-heading" style="font-size: 2rem; color: #1e3a8a; margin-bottom: 1rem;">
        {{ action_title }}
    </h1>

    <div class="action-details" style="background: #f8fafc; border-left: 6px solid #2563eb; padding: 1.5rem; margin-bottom: 2rem; font-size: 1.25rem; line-height: 1.6;">
        <p style="margin-bottom: 0.75rem;"><strong>Medication:</strong> {{ medication_name }} {% if dosage %}({{ dosage }}){% endif %}</p>
        <p style="margin-bottom: 0.75rem;"><strong>Scheduled Time:</strong> {{ scheduled_time }}</p>
        <p style="margin-bottom: 0;">{{ description }}</p>
    </div>

    <form action="/actions/execute" method="post" class="accessible-form">
        <input type="hidden" name="token" value="{{ token }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-actions" style="display: flex; flex-direction: column; gap: 1rem;">
            <button type="submit" class="btn {{ button_class }}" style="min-height: 64px; font-size: 1.35rem; font-weight: bold; padding: 1rem 2rem; border-radius: 8px; cursor: pointer; text-align: center; border: 2px solid transparent;">
                {{ button_text }}
            </button>
            <a href="/" class="btn btn-secondary" style="text-align: center; padding: 0.75rem; font-size: 1.15rem; text-decoration: none; color: #4b5563;">
                Cancel and Return
            </a>
        </div>
    </form>
</section>
{% endblock %}
